name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"
  # The image infra deploys. The migration tests run its clickhouse binary.
  CLICKHOUSE_IMAGE: "clickhouse/clickhouse-server:26.8.22.13@sha256:110d3d1f8e1ed7e451a6b5d85a16761e948ad43bc2d9ddf10b155964a8b2b40c"

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Fail if pyright analysed no file
        run: uv run pyright --outputjson | jq -e '.summary.filesAnalyzed > 0' > /dev/null
      - run: uv run lint-imports
      - name: Put the clickhouse binary on the PATH
        run: |
          mkdir -p "$RUNNER_TEMP/clickhouse"
          docker create --name clickhouse "$CLICKHOUSE_IMAGE"
          docker cp clickhouse:/usr/bin/clickhouse "$RUNNER_TEMP/clickhouse/clickhouse"
          docker rm clickhouse
          echo "$RUNNER_TEMP/clickhouse" >> "$GITHUB_PATH"
      - name: Cache integration test images
        env:
          CLICKHOUSE_PORT: "18123"
          GCS_PORT: "14443"
          PREFECT_PORT: "14200"
        run: docker compose -f tests/e2e/compose.yaml pull --policy always
      - run: uv run pytest -q

  # uv does not enforce import isolation, so each package also runs alone, with only its own
  # dependencies and, for an adapter, only its own extra.
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: openknowledge-contracts
            tests: packages/contracts/tests
          - package: openknowledge-core
            tests: packages/core/tests
          - package: openknowledge-adapters
            extra: semantic-scholar
            module: openknowledge_adapters.semantic_scholar
            tests: packages/adapters/tests/semantic_scholar
          - package: openknowledge-adapters
            extra: gcs
            module: openknowledge_adapters.gcs
            tests: packages/adapters/tests/gcs
          - package: openknowledge-adapters
            extra: clickhouse
            module: openknowledge_adapters.clickhouse
            tests: packages/adapters/tests/clickhouse
          - package: openknowledge-adapters
            extra: batch
            module: openknowledge_adapters.batch
            tests: packages/adapters/tests/batch
          - package: openknowledge-pipelines
            tests: pipelines/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install this package alone
        env:
          PACKAGE: ${{ matrix.package }}
          EXTRA: ${{ matrix.extra }}
        run: uv sync --locked --package "$PACKAGE" ${EXTRA:+--extra "$EXTRA"}
      - name: Import the adapter with only its own extra installed
        if: matrix.module
        env:
          MODULE: ${{ matrix.module }}
        run: uv run --no-sync python -c "import importlib, os; importlib.import_module(os.environ['MODULE'])"
      - name: Run its tests
        env:
          TESTS: ${{ matrix.tests }}
        run: uv run --no-sync pytest -q "$TESTS"
